version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: batelata-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: batelata
      POSTGRES_PASSWORD: batelata_dev
      POSTGRES_DB: batelata
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
